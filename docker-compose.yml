services:
  db:
    image: postgres:17-alpine
    container_name: itsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm_password
      POSTGRES_DB: itsm
    ports:
      - "5433:5432"
    volumes:
      - itsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  itsm_pgdata:
